services:
  # 1. Payment Ledger Web API & Embedded SPA Dashboard
  - type: web
    name: payment-ledger-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    preDeployCommand: /migrate -path=/migrations -database=$DATABASE_URL up && /seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-ledger-db
          property: connectionString
      - key: GIN_MODE
        value: release
      - key: PORT
        value: 10000

  # 2. Continuous Reconciliation & Idempotency Garbage Collection Worker
  - type: worker
    name: payment-ledger-audit-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /audit-worker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-ledger-db
          property: connectionString

databases:
  # 3. Managed PostgreSQL Database
  - name: payment-ledger-db
    databaseName: payment_ledger
    user: postgres
    plan: free
    region: oregon
    postgresMajorVersion: 15
