services:
  # 1. Payment Ledger Web API & Embedded SPA Dashboard (with embedded audit reconciliation worker)
  - type: web
    name: payment-ledger-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-ledger-db
          property: connectionString
      - key: GIN_MODE
        value: release
      - key: PORT
        value: 10000
      - key: RUN_AUDIT_WORKER
        value: "true"

databases:
  # 2. Managed PostgreSQL Database
  - name: payment-ledger-db
    databaseName: payment_ledger
    plan: free
    region: oregon
    postgresMajorVersion: 15
