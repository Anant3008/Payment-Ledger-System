services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_ledger"]
      interval: 2s
      timeout: 2s
      retries: 10

  migration:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:z
    command: ["-path=/migrations", "-database=postgres://postgres:postgres@db:5432/payment_ledger?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/payment_ledger?sslmode=disable
      - PORT=8080
    ports:
      - "8080:8080"

  audit-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/audit-worker"]
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/payment_ledger?sslmode=disable

volumes:
  pgdata:
