name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Setup a PostgreSQL service container for integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Database Migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/*.up.sql; do
            psql -h localhost -U postgres -d payment_ledger -f "$f"
          done

      - name: Run Tests with Race Detector
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/payment_ledger?sslmode=disable
        run: go test -v -race ./...
